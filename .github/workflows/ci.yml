name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: core tests + lint (CPython 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "pytest>=8" "pytest-cov>=5" "ruff>=0.6"
      - run: ruff check .
      - run: pytest tests/core -q --cov=laserbench/core --cov-report=term-missing

  freecad:
    name: FreeCAD tests (freecadcmd, conda-forge)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge
          channel-priority: strict
          activate-environment: fc
      - run: conda install -y "freecad=1.1"
      - run: freecadcmd tests/fc/run_all.py
      - name: GUI smoke tests (xvfb)
        # No `exit` on the success path: in this login shell (bash -el) an explicit exit runs
        # ~/.bash_logout, whose clear_console fails without a terminal and turns 0 into 1.
        run: |
          command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
          rm -f tests/gui/result.txt
          status=0
          timeout 300 xvfb-run -a freecad tests/gui/run_all.py || status=$?
          echo "GUI runner exit status: $status"
          # The GUI swallows stdout, so the runner writes its report to a file. A crash
          # before the report is written must fail the step, not pass it silently.
          if [ ! -s tests/gui/result.txt ]; then
            echo "tests/gui/result.txt missing or empty: the GUI test runner crashed"
            false
          fi
          cat tests/gui/result.txt
          grep -qx "OK" tests/gui/result.txt
          [ "$status" -eq 0 ]
