name: Release check

# Runs when a version tag is pushed. Fails if the tag (vX.Y.Z) does not match the version in
# package.xml, or if the version copies and CHANGELOG.md disagree. See docs/RELEASING.md.
on:
  push:
    tags: ["v*"]

jobs:
  version:
    name: tag matches package.xml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/version.py check --tag "$GITHUB_REF_NAME"
